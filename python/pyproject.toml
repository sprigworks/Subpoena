[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subpoena"
version = "0.1.0a2"
description = "Trace-native testing: OpenTelemetry spans as the test interface, enforcement proven by an independent witness."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
keywords = ["opentelemetry", "testing", "tracing", "traceql", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
]

[project.scripts]
subpoena-cross = "subpoena.cross:main"

[project.urls]
Homepage = "https://subpoena.dev"
Source = "https://github.com/sprigworks/subpoena"
Documentation = "https://github.com/sprigworks/subpoena/blob/main/python/README.md"
Changelog = "https://github.com/sprigworks/subpoena/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8", "pyyaml>=6", "pytest-timeout>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
