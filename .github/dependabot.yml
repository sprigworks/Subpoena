version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: /examples/adopter
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      adopter-go:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns:
          - "*"
