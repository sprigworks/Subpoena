name: cross-self-long

# Cross on internal/cross, the part of `make cross-self` that tier1 leaves out:
# each mutant reruns a 5-minute suite four times, past GitHub's 6-hour limit
# for hosted runners. This job runs on a self-hosted runner instead.
#
# The runner takes only jobs labelled subpoena-cross-long. It must never run
# code from a fork: so no pull_request or push trigger here, the job checks
# that it is on main in sprigworks/Subpoena, and the repository requires
# approval before any outside contributor's workflow runs.
on:
  schedule:
    - cron: "0 6 * * 0" # Sundays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-self-long
  cancel-in-progress: false

jobs:
  internal-cross:
    if: github.repository == 'sprigworks/Subpoena' && github.ref == 'refs/heads/main'
    runs-on: [subpoena-cross-long]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false
      - name: cross-examination over internal/cross
        run: go run ./cmd/subpoena-cross -timeout 20m -j 8 ./internal/cross
