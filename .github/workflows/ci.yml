name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tier1:
    runs-on: ubuntu-latest
    env:
      # go.mod points the vanity-path modules at GitHub mirrors (see Makefile),
      # which works with or without the module proxy. Setting these keeps CI
      # identical to the sandbox the scaffold was built in.
      GOPROXY: direct
      GOSUMDB: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: subpoena-lint over examples/gateway
        run: go run ./cmd/subpoena-lint ./examples/gateway
      - name: fault gate over examples/gateway
        run: go run ./cmd/subpoena-gate ./examples/gateway
