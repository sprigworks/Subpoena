name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tier1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: subpoena-lint over examples/gateway
        run: go run ./cmd/subpoena-lint -dead-telemetry ./examples/gateway
      - name: cross-examination over examples/gateway
        run: go run ./cmd/subpoena-cross --require-witness ./examples/gateway
      - name: subpoena-lint over examples/saidno
        run: go run ./cmd/subpoena-lint ./examples/saidno
      - name: cross-examination over examples/saidno
        run: go run ./cmd/subpoena-cross --require-witness ./examples/saidno
      - name: the demo comes out as its README says
        run: make demo
      # Cross over Subpoena's own guards, minus two packages. internal/cross
      # runs in cross-internal.yml: each of its mutants reruns a 5-minute suite
      # several times, past GitHub's 6-hour job limit. pkg/witness has about
      # 300 mutants, 2.5 hours at -j 1, so the witness-cross jobs below split it
      # into shards that run beside tier1. `make cross-self` and `make check`
      # still run all of CROSS_SELF in one go.
      - name: cross-examination over Subpoena's own guards
        run: make cross-self CROSS_SELF="./pkg/harness ./conformance/oatscapture"
      # Evidence, not a pass bar: the runner's process count, full-scan and
      # children-walk cost, and how many short processes ProcWitness caught.
      - name: ProcWitness benchmarks (report only)
        run: go test -run '^$' -bench 'Proc' -benchtime 50x ./pkg/witness

  # Cross over pkg/witness/..., split with `subpoena-cross -shard`. Every shard
  # of a commit computes the same split and judges its share; witness-cross
  # checks that the shards together judged every mutant exactly once, and
  # fails if any shard failed. The shard count appears twice: in the matrix and
  # in WITNESS_SHARDS. Keep them equal.
  witness-cross-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: true
      - name: cross-examination over pkg/witness, shard ${{ matrix.shard }}
        env:
          WITNESS_SHARDS: "6"
        run: |
          set -o pipefail
          go build -o "$RUNNER_TEMP/subpoena-cross" ./cmd/subpoena-cross
          "$RUNNER_TEMP/subpoena-cross" -timeout 20m -shard "${{ matrix.shard }}/$WITNESS_SHARDS" ./pkg/witness | tee "$RUNNER_TEMP/shard-${{ matrix.shard }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: witness-cross-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}.txt
          if-no-files-found: ignore

  witness-cross:
    needs: witness-cross-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: witness-cross-shard-*
          path: shards
          merge-multiple: true
      - name: every mutant judged once
        run: .github/scripts/cross-shards-cover.sh 6 shards/shard-*.txt
      - name: every shard passed
        if: needs.witness-cross-shard.result != 'success'
        run: |
          echo "a shard failed or was cancelled: ${{ needs.witness-cross-shard.result }}" >&2
          exit 1

  # The Python port (python/): its own tests over the shared corpus, then the
  # evaluator through subpoena-conform, the protocol every port is checked by.
  python:
    # ubuntu-latest is Ubuntu 26.04 and actions/setup-python has no CPython
    # 3.9 for it, so the required python (3.9) check cannot start.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: true
      - name: install
        run: python -m pip install -e "python[test]"
      - name: pytest
        run: python -m pytest -q python
      - name: subpoena-conform over the Python evaluator
        run: go run ./cmd/subpoena-conform -- python -m subpoena.traceql

  # examples/python-quickstart: the Level 0 example for a Python project,
  # installed from the in-repo port the way `pip install subpoena` would.
  python-quickstart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/python-quickstart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install ../../python pytest
      - name: pytest
        run: python -m pytest -q
      - name: subpoena-lint (explicit Level 0 exemptions)
        run: >-
          subpoena-lint --registry ../../generated/python/semconv.py
          --exempt 'unknown-telemetry=Level 0 deliberately uses plain names without a registry'
          .
      # Level 0 observes an in-memory dictionary; it has no independent
      # process/network witness and does not claim strict witness credit.
      - name: cross-examination (Level 0; ordinary assertion kills)
        run: subpoena-cross .

  # examples/adopter is a separate module adopting Subpoena from outside, with
  # only its public packages and commands (as Go tools). It keeps that path
  # working, and checks its generated names with real Weaver.
  adopter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/adopter
    env:
      WEAVER_VERSION: v0.28.0
      WEAVER_SHA256: 9878e2d56ad82ae441b0b527377a4f6001ae19f4af362fb0a4d951884f59ab61
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: examples/adopter/go.sum
      - name: Install Weaver
        run: |
          curl -fsSL -o /tmp/weaver.tar.xz \
            "https://github.com/open-telemetry/weaver/releases/download/${WEAVER_VERSION}/weaver-x86_64-unknown-linux-gnu.tar.xz"
          echo "${WEAVER_SHA256}  /tmp/weaver.tar.xz" | sha256sum -c -
          tar -xf /tmp/weaver.tar.xz -C /tmp
          sudo install /tmp/weaver-x86_64-unknown-linux-gnu/weaver /usr/local/bin/weaver
      - name: generated/ matches registry/ (Weaver)
        run: make check-generated
      - name: invariants/names.go is current
        run: go generate ./invariants && git diff --exit-code invariants/
      - name: test, lint, cross-examination
        run: make check

  # examples/quickstart is Level 0 of the adoption ladder: one rule, no
  # registry, no Weaver. Lint runs with an explicit vocabulary exemption.
  quickstart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/quickstart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: examples/quickstart/go.sum
      - name: test, lint, cross-examination
        run: make check
  platform-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/platform/shared
    env:
      WEAVER_VERSION: v0.28.0
      WEAVER_SHA256: 9878e2d56ad82ae441b0b527377a4f6001ae19f4af362fb0a4d951884f59ab61
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: examples/platform/shared/go.sum
      - name: Install Weaver
        run: |
          curl -fsSL -o /tmp/weaver.tar.xz \
            "https://github.com/open-telemetry/weaver/releases/download/${WEAVER_VERSION}/weaver-x86_64-unknown-linux-gnu.tar.xz"
          echo "${WEAVER_SHA256}  /tmp/weaver.tar.xz" | sha256sum -c -
          tar -xf /tmp/weaver.tar.xz -C /tmp
          sudo install /tmp/weaver-x86_64-unknown-linux-gnu/weaver /usr/local/bin/weaver
      - name: Validate and regenerate the shared contract
        run: |
          weaver registry check -r registry --future
          make check-generated
      - name: Shared module tests and alert contract checks
        run: make check

  platform-service:
    needs: platform-contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [build, deploy]
    defaults:
      run:
        working-directory: examples/platform/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: |
            examples/platform/shared/go.sum
            examples/platform/services/${{ matrix.service }}/go.sum
      - name: Service race tests, shared registry lint, enforcement mutants
        run: make check

