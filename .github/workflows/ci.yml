name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tier1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: subpoena-lint over examples/gateway
        run: go run ./cmd/subpoena-lint -dead-telemetry ./examples/gateway
      - name: cross-examination over examples/gateway
        run: go run ./cmd/subpoena-cross ./examples/gateway
      - name: cross-examination over Subpoena's own guards
        run: make cross-self
      # Evidence, not a pass bar: the runner's process count, full-scan and
      # children-walk cost, and how many short processes ProcWitness caught.
      - name: ProcWitness benchmarks (report only)
        run: go test -run '^$' -bench 'Proc' -benchtime 50x ./pkg/witness

  # The Python port (python/): its own tests over the shared corpus, then the
  # evaluator through subpoena-conform, the protocol every port is checked by.
  python:
    # ubuntu-latest is Ubuntu 26.04 and actions/setup-python has no CPython
    # 3.9 for it, so the required python (3.9) check cannot start.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: install
        run: python -m pip install -e "python[test]"
      - name: pytest
        run: python -m pytest -q python
      - name: subpoena-conform over the Python evaluator
        run: go run ./cmd/subpoena-conform -- python -m subpoena.traceql

  # examples/python-quickstart: the Level 0 example for a Python project,
  # installed from the in-repo port the way `pip install subpoena` would.
  python-quickstart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/python-quickstart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install ../../python pytest
      - name: pytest
        run: python -m pytest -q
      - name: cross-examination (every mutant killed)
        run: subpoena-cross .

  # examples/adopter is a separate module adopting Subpoena from outside, with
  # only its public packages and commands (as Go tools). It keeps that path
  # working, and checks its generated names with real Weaver.
  adopter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/adopter
    env:
      WEAVER_VERSION: v0.28.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: examples/adopter/go.sum
      - name: Install Weaver
        run: |
          curl -fsSL -o /tmp/weaver.tar.xz \
            "https://github.com/open-telemetry/weaver/releases/download/${WEAVER_VERSION}/weaver-x86_64-unknown-linux-gnu.tar.xz"
          tar -xf /tmp/weaver.tar.xz -C /tmp
          sudo install /tmp/weaver-x86_64-unknown-linux-gnu/weaver /usr/local/bin/weaver
      - name: generated/ matches registry/ (Weaver)
        run: make check-generated
      - name: invariants/names.go is current
        run: go generate ./invariants && git diff --exit-code invariants/
      - name: test, lint, cross-examination
        run: make check

  # examples/quickstart is Level 0 of the adoption ladder: one rule, no
  # registry, no Weaver. Test and cross-examination only (lint needs a registry).
  quickstart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/quickstart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: examples/quickstart/go.sum
      - name: test, cross-examination
        run: make check
  platform-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/platform/shared
    env:
      WEAVER_VERSION: v0.28.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: examples/platform/shared/go.sum
      - name: Install Weaver
        run: |
          curl -fsSL -o /tmp/weaver.tar.xz \
            "https://github.com/open-telemetry/weaver/releases/download/${WEAVER_VERSION}/weaver-x86_64-unknown-linux-gnu.tar.xz"
          tar -xf /tmp/weaver.tar.xz -C /tmp
          sudo install /tmp/weaver-x86_64-unknown-linux-gnu/weaver /usr/local/bin/weaver
      - name: Validate and regenerate the shared contract
        run: |
          weaver registry check -r registry --future
          make check-generated
      - name: Shared module tests and alert contract checks
        run: make check

  platform-service:
    needs: platform-contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [build, deploy]
    defaults:
      run:
        working-directory: examples/platform/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            examples/platform/shared/go.sum
            examples/platform/services/${{ matrix.service }}/go.sum
      - name: Service race tests, shared registry lint, enforcement mutants
        run: make check

