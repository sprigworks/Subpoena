name: publish-python

# Publishes python/ to PyPI when a tag python/v<version> is pushed, through
# PyPI Trusted Publishing: GitHub vouches for this workflow, so no API token
# exists anywhere. The PyPI side is set up once by the project owner (pending
# publisher: repository sprigworks/subpoena, workflow publish-python.yml,
# environment pypi).
on:
  push:
    tags: ["python/v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      - name: tag matches the package version
        run: |
          want="${GITHUB_REF_NAME#python/v}"
          have=$(python -c "import tomllib;print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")
          test "$want" = "$have" || { echo "tag $GITHUB_REF_NAME but pyproject.toml says $have" >&2; exit 1; }
      - name: the port checks pass
        run: |
          python -m pip install -e "python[test]"
          python -m pytest -q python
          go run ./cmd/subpoena-conform -- python -m subpoena.traceql
      - name: build
        run: |
          python -m pip install build==1.2.2 twine==6.0.1
          python -m build python
          python -m twine check python/dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
