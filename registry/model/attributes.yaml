# Custom attribute `tier` annotation:
#   test - never exported in production (high cardinality / diagnostic only)
#   all  - safe to export in every environment
groups:
  - id: registry.session
    type: attribute_group
    display_name: Agent session attributes
    brief: Attributes describing an agent gateway session.
    stability: stable
    attributes:
      - id: session.id
        type: string
        stability: stable
        brief: Identifier of the agent session.
        note: High cardinality; tier test, so it is never exported in production.
        examples: ["sess-7f3a"]
        annotations:
          tier: test

  - id: registry.authorization
    type: attribute_group
    display_name: Authorization attributes
    brief: Attributes describing an authorization decision.
    stability: stable
    attributes:
      - id: authorization.allowed
        type: boolean
        stability: stable
        brief: Whether the authorization decision allowed the requested action.
        examples: [true, false]
        annotations:
          tier: all
      - id: authorization.policy_id
        type: string
        stability: stable
        brief: Identifier of the policy that produced the decision.
        examples: ["deny-prod-nonadmin"]
        annotations:
          tier: all

  - id: registry.witness
    type: attribute_group
    display_name: Witness correlation attributes
    brief: Attributes describing how an independent witness can tie a process to a session.
    stability: stable
    attributes:
      - id: subpoena.witness.correlation
        type:
          members:
            - id: cgroup
              value: cgroup
              brief: The exec was started inside a cgroup named with the session's trace ID; a witness correlates by that cgroup.
              stability: stable
            - id: lineage
              value: lineage
              brief: No session cgroup could be created; a witness can only correlate by parent-process lineage.
              stability: stable
            - id: argument
              value: argument
              brief: Neither a cgroup nor lineage is available; correlation relies on a distinguishing command-line argument.
              stability: stable
        stability: stable
        brief: How an independent witness can correlate the spawned process with this session.
        note: >
          Recorded by the gateway when it starts a process. cgroup is the
          strong, production correlation; lineage and argument are fallbacks
          and are weaker evidence for absence claims.
        examples: ["cgroup", "lineage"]
        annotations:
          tier: test
