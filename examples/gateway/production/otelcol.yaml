# Tier 3: a production OpenTelemetry Collector that keeps test-tier attributes
# (registry `tier: test`, such as session.id) out of the backend. The
# transform processor block is generated from the registry's tiers by
# pkg/production.CollectorConfig; pkg/production's tests fail if it drifts.
# Validated with otel/opentelemetry-collector-contrib:0.116.1 (`validate`).
#
# Go services can drop them in-process instead (production.Exporter); the
# gateway does with SUBPOENA_EXPORT_TIER=production. Use one or both.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  transform/subpoena-drop-test-tier:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "process.command_line")
          - delete_key(attributes, "session.id")
          - delete_key(attributes, "subpoena.witness.correlation")
      - context: spanevent
        statements:
          - delete_key(attributes, "process.command_line")
          - delete_key(attributes, "session.id")
          - delete_key(attributes, "subpoena.witness.correlation")
  batch: {}

exporters:
  otlphttp:
    endpoint: ${env:TRACES_ENDPOINT}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/subpoena-drop-test-tier, batch]
      exporters: [otlphttp]
