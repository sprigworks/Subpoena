# Tail subpoena-witness's JSON lines and send each to Loki (via the LGTM
# collector's OTLP/HTTP endpoint), labelled service_name=subpoena-witness.
receivers:
  filelog:
    include: [/var/run/subpoena-witness/events.json]
    start_at: beginning
processors:
  resource:
    attributes:
      - key: service.name
        value: subpoena-witness
        action: upsert
  batch:
    timeout: 200ms
exporters:
  otlphttp:
    endpoint: http://lgtm:4318
    tls:
      insecure: true
service:
  pipelines:
    logs:
      receivers: [filelog]
      processors: [resource, batch]
      exporters: [otlphttp]
