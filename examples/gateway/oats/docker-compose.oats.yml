# NOT EXECUTED in the scaffold environment (no Docker, no eBPF). Written against
# the documented behaviour of OATS, grafana/otel-lgtm and Tetragon; expect to
# fix details on first real run.
#
# OATS adds the Grafana LGTM stack (Grafana, Tempo, Loki, collector) as the
# `lgtm` service. This file supplies the application under test and the witness.
services:
  gateway:
    build:
      context: ../../..
      dockerfile: examples/gateway/Dockerfile
    environment:
      OTEL_SERVICE_NAME: gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    ports:
      - "127.0.0.1::8080"

  # The independent witness: a kernel-side process-exec observer that the
  # gateway does not control. Needs a privileged container on a Linux host with
  # BTF; it will not run on Docker Desktop for Mac or Windows.
  tetragon:
    image: quay.io/cilium/tetragon:v1.4.0
    pid: host
    privileged: true
    command:
      - /usr/bin/tetragon
      - --export-filename=/var/run/tetragon/events.json
      - --tracing-policy-dir=/etc/tetragon/tetragon.tp.d
    volumes:
      - /sys/kernel:/sys/kernel:ro
      - tetragon-events:/var/run/tetragon
      - ../../../witnesses/tetragon:/etc/tetragon/tetragon.tp.d:ro

  # Ships Tetragon's JSON export to Loki through the LGTM collector.
  witness-shipper:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./witness-shipper.yaml:/etc/otelcol/config.yaml:ro
      - tetragon-events:/var/run/tetragon:ro
    depends_on:
      - tetragon

volumes:
  tetragon-events:
