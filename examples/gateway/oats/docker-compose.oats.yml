# Run with `make oats` (OATS v0.10.0, gcx 1.0.0, grafana/otel-lgtm) on Linux
# 6.17, rootful Docker, cgroup v2, BTF.
#
# OATS adds the Grafana LGTM stack (Grafana, Tempo, Loki, collector) as the
# `lgtm` service. This file supplies the application under test and the witness.
services:
  gateway:
    build:
      context: ../../..
      dockerfile: examples/gateway/Dockerfile
    environment:
      OTEL_SERVICE_NAME: gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      # One cgroup per session, <root>/<trace id>. Needs a writable cgroup v2
      # hierarchy, hence the privileges below. If creation fails the gateway
      # falls back (logged once at debug level) and its exec spans say so.
      SUBPOENA_CGROUP_ROOT: /sys/fs/cgroup/subpoena
      SUBPOENA_CORRELATION_FALLBACK: argument
    # A demo rig, not a pattern: write access to cgroupfs so the gateway can
    # create session cgroups. Verified: without `privileged` /sys/fs/cgroup is
    # read-only and correlation falls back to the argument. `cgroup: host` is
    # not needed: in the default private cgroup namespace the session cgroups
    # nest under the container's own cgroup and go away with it.
    privileged: true
    ports:
      - "127.0.0.1::8080"
    # No request is served before the witness is attached.
    depends_on:
      witness:
        condition: service_healthy

  # The independent witness: Subpoena's kernel-side exec observer
  # (pkg/witness/execbpf), which the gateway does not control. It reports each
  # exec with the process's session cgroup, read in the kernel. Needs a
  # privileged container on a Linux host with cgroup v2 and BTF; not Docker
  # Desktop, not rootless Docker or Podman. pid: host so the PIDs it reports are
  # the host's and every process is visible to it. -all writes every exec on
  # the host, which the argument case needs; the cgroup case filters on
  # attribution. (Tetragon was the witness here until it turned out not to
  # report the session cgroup outside Kubernetes; see witnesses/README.md.)
  witness:
    build:
      context: ../../..
      dockerfile: cmd/subpoena-witness/Dockerfile
    pid: host
    privileged: true
    command:
      - -all
      - -cgroup-root=/sys/fs/cgroup/subpoena
      - -out=/var/run/subpoena-witness/events.json
      - -ready=/var/run/subpoena-witness/ready
    volumes:
      - witness-events:/var/run/subpoena-witness
    healthcheck:
      test: ["CMD", "/subpoena-witness", "-check-ready=/var/run/subpoena-witness/ready"]
      interval: 1s
      retries: 30

  # Ships the witness's JSON lines to Loki through the LGTM collector.
  witness-shipper:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./witness-shipper.yaml:/etc/otelcol/config.yaml:ro
      - witness-events:/var/run/subpoena-witness:ro
    depends_on:
      - witness

volumes:
  witness-events:
