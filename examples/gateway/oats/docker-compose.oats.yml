# Run 2026-10-25 with OATS v0.10.0 (gcx 1.0.0), grafana/otel-lgtm 0.38 and
# Tetragon v1.7.1 on Linux 6.17, rootful Docker, cgroup v2 (`make oats`).
#
# OATS adds the Grafana LGTM stack (Grafana, Tempo, Loki, collector) as the
# `lgtm` service. This file supplies the application under test and the witness.
services:
  gateway:
    build:
      context: ../../..
      dockerfile: examples/gateway/Dockerfile
    environment:
      OTEL_SERVICE_NAME: gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      # One cgroup per session, <root>/<trace id>. Needs a writable cgroup v2
      # hierarchy, hence the privileges below. If creation fails the gateway
      # falls back (logged once at debug level) and its exec spans say so.
      SUBPOENA_CGROUP_ROOT: /sys/fs/cgroup/subpoena
      SUBPOENA_CORRELATION_FALLBACK: argument
    # A demo rig, not a pattern: write access to cgroupfs so the gateway can
    # create session cgroups. Verified: without `privileged` /sys/fs/cgroup is
    # read-only and correlation falls back to the argument. `cgroup: host` is
    # not needed: in the default private cgroup namespace the session cgroups
    # nest under the container's own cgroup and go away with it.
    privileged: true
    ports:
      - "127.0.0.1::8080"

  # The independent witness: a kernel-side process-exec observer that the
  # gateway does not control. Needs a privileged container on a Linux host with
  # BTF; it will not run on Docker Desktop for Mac or Windows, or under rootless
  # Docker or Podman. v1.4.0 could not load the TracingPolicy's kprobe on Linux
  # 6.17 ("load program: invalid argument"); v1.7.1 loads it.
  tetragon:
    image: quay.io/cilium/tetragon:v1.7.1
    pid: host
    privileged: true
    command:
      - /usr/bin/tetragon
      - --export-filename=/var/run/tetragon/events.json
      # The shipper's collector image runs as a non-root user; the default 600
      # left it unable to read the export.
      - --export-file-perm=644
      # Tetragon sees every exec on the host. Export exec events only; the
      # witness queries filter further by binary and arguments.
      - '--export-allowlist={"event_set":["PROCESS_EXEC"]}'
      - --tracing-policy-dir=/etc/tetragon/tetragon.tp.d
    volumes:
      - /sys/kernel:/sys/kernel:ro
      - tetragon-events:/var/run/tetragon
      - ../../../witnesses/tetragon:/etc/tetragon/tetragon.tp.d:ro

  # Ships Tetragon's JSON export to Loki through the LGTM collector.
  witness-shipper:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./witness-shipper.yaml:/etc/otelcol/config.yaml:ro
      - tetragon-events:/var/run/tetragon:ro
    depends_on:
      - tetragon

volumes:
  tetragon-events:
