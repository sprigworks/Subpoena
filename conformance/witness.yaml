# The witness file (docs/ports.md W3, W4): what a port's reader must report
# for each file. lines are written as-is, one per file line. read_error: the
# read itself fails, with a message containing this text. health: "ok" or
# text the capture fault must contain. spawned: PIDs per trace ID, in file
# order. no_spawn: the verdict of the no-spawn check for that trace ID.
# wrote: file-event paths per trace ID, in file order (W7). no_write: the
# verdict of the no-write check for that trace ID, about no_write_paths (none:
# anything).
# delivered: peers per trace ID, in file order ("" is an unknown peer).
# no_delivery: the verdict of the no-delivery check for that trace ID, about the
# peers in no_delivery_peers (none named: every send).
# committed: the verbs of the committed row lines (a database witness), per trace
# ID, in file order. no_row: the verdict of the no-row check for that trace ID.
traces: {A: c0de00000000000000000000000000a1, B: c0de00000000000000000000000000b2, C: c0de00000000000000000000000000c3}
cases:
  # One capture window closed by a healthy stop: absence rests on it.
  - name: healthy_window
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:01Z","pid":7,"ppid":1,"host_pid":4007,"comm":"sleep","exe":"/usr/bin/x","command":"sleep 1","args":["sleep","1"],"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:01Z","pid":8,"ppid":1,"host_pid":4008,"comm":"sleep","exe":"/usr/bin/x","command":"sleep 1","args":["sleep","1"],"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000b2","trace_id":"c0de00000000000000000000000000b2","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "ok"
    spawned:
      A: [7]
      B: [8]
      C: []
    no_spawn:
      A: Fail
      C: Pass

  # A file with execs and no records (an older witness, or cut short): what ran still counts, absence is Inconclusive.
  - name: no_records
    lines:
      - '{"time":"2026-10-28T12:00:01Z","pid":7,"ppid":1,"host_pid":4007,"comm":"sleep","exe":"/usr/bin/x","command":"sleep 1","args":["sleep","1"],"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
    health: "no start or stop records"
    spawned:
      A: [7]
    no_spawn:
      A: Fail
      C: Inconclusive

  # Nothing at all: no capture health, so no absence.
  - name: empty_file
    lines: []
    health: "no start or stop records"
    spawned:
      A: []
    no_spawn:
      A: Inconclusive

  # The witness was killed, or the file read before it stopped.
  - name: never_stopped
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:01Z","pid":7,"ppid":1,"host_pid":4007,"comm":"sleep","exe":"/usr/bin/x","command":"sleep 1","args":["sleep","1"],"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
    health: "never stopped"
    spawned:
      A: [7]
    no_spawn:
      A: Fail
      C: Inconclusive

  # The stop record says kernel events were lost.
  - name: lost_events
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":false,"error":"execbpf: lost 3 kernel event(s)"}'
    health: "lost 3 kernel event(s)"
    spawned:
      A: []
    no_spawn:
      A: Inconclusive

  # A stop that claims health but carries an error is unhealthy.
  - name: healthy_with_error
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true,"error":"write: disk full"}'
    health: "disk full"
    spawned:
      A: []
    no_spawn:
      A: Inconclusive

  # An exec before any start: written when nothing vouched for the capture.
  - name: exec_outside_window
    lines:
      - '{"time":"2026-10-28T12:00:01Z","pid":7,"ppid":1,"host_pid":4007,"comm":"sleep","exe":"/usr/bin/x","command":"sleep 1","args":["sleep","1"],"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "outside any capture window"
    spawned:
      A: [7]
    no_spawn:
      A: Fail
      C: Inconclusive

  # Two runs appended to one file, each closed by a healthy stop.
  - name: two_windows
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:01Z","pid":7,"ppid":1,"host_pid":4007,"comm":"sleep","exe":"/usr/bin/x","command":"sleep 1","args":["sleep","1"],"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
      - '{"time":"2026-10-28T12:01:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:01:01Z","pid":9,"ppid":1,"host_pid":4009,"comm":"curl","exe":"/usr/bin/x","command":"curl x","args":["curl","x"],"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:01:09Z","record":"stop","healthy":true}'
    health: "2 capture windows"
    spawned:
      A: [7, 9]
    no_spawn:
      A: Fail
      C: Inconclusive

  # An exec after one stop and before the next start.
  - name: exec_between_windows
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
      - '{"time":"2026-10-28T12:00:01Z","pid":7,"ppid":1,"host_pid":4007,"comm":"sleep","exe":"/usr/bin/x","command":"sleep 1","args":["sleep","1"],"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "outside any capture window"
    spawned:
      A: [7]
    no_spawn:
      C: Inconclusive

  # A second start before the first window stopped.
  - name: start_inside_window
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "still open"
    spawned:
      A: []
    no_spawn:
      A: Inconclusive

  # A stop with no window open.
  - name: stop_without_start
    lines:
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "no capture open"
    spawned:
      A: []
    no_spawn:
      A: Inconclusive

  # A record kind this reader does not know is an error, never skipped.
  - name: unknown_record
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time": "2026-10-28T12:00:05Z", "record": "pause"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "unknown record"

  # A record must carry its time.
  - name: record_without_time
    lines:
      - '{"record": "start"}'
    read_error: "no time"

  # healthy of the wrong type: the read fails.
  - name: healthy_not_a_boolean
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":"yes"}'
    read_error: "line 2"

  # A line cut mid-object: the read fails, it is never skipped.
  - name: malformed_line
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:01Z","pid":7,'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "line 2"

  # NaN is not JSON: the read fails.
  - name: nan_value
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:01Z","pid":NaN,"ppid":1,"trace_id":"c0de00000000000000000000000000a1"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "line 2"

  # A record at the zero time has no time.
  - name: zero_time
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"0001-01-01T00:00:00Z","record":"stop","healthy":true}'
    read_error: "no time"

  # A time without a zone is not RFC 3339: the read fails.
  - name: time_without_zone
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:09","record":"stop","healthy":true}'
    read_error: "line 2"

  # A numeric time: the read fails.
  - name: time_not_a_string
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":5,"record":"stop","healthy":true}'
    read_error: "line 2"

  # A key that differs from a known one only by case is refused, so no reader takes it for that field.
  - name: key_in_another_case
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:01Z","pid":7,"ppid":1,"host_pid":4007,"comm":"sleep","exe":"/usr/bin/x","command":"sleep 1","args":["sleep","1"],"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","Record":"stop","healthy":true}'
    read_error: "another case"

  # A stop that does not say healthy is unhealthy.
  - name: stop_without_healthy
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop"}'
    health: "capture unhealthy"
    no_spawn:
      C: Inconclusive

  # A stop with healthy null is unhealthy.
  - name: healthy_null
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":null}'
    health: "capture unhealthy"
    no_spawn:
      C: Inconclusive

  # A healthy second window does not clear the first window's fault.
  - name: unhealthy_then_healthy
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:05Z","record":"stop","healthy":false,"error":"ring buffer lost 3 events"}'
      - '{"time":"2026-10-28T12:01:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:01:09Z","record":"stop","healthy":true}'
    health: "capture unhealthy"
    no_spawn:
      C: Inconclusive

  # A start after the last stop: that capture never stopped.
  - name: trailing_start
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
      - '{"time":"2026-10-28T12:01:00Z","record":"start","healthy":false,"captures":["exec"]}'
    health: "never stopped"
    no_spawn:
      C: Inconclusive

  # An integer outside the range its field is decoded into (uint64 for cgroup_id): the read fails.
  - name: cgroup_id_negative
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:00Z","cgroup_id":-1}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "line 2"

  # int64 for the PIDs: one past its maximum fails the read.
  - name: pid_past_int64
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:01Z","pid":9223372036854775808,"trace_id":"c0de00000000000000000000000000a1"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "line 2"

  # The largest cgroup ID is still a cgroup ID.
  - name: cgroup_id_max
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:01Z","pid":7,"cgroup_id":18446744073709551615,"trace_id":"c0de00000000000000000000000000a1"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "ok"
    spawned:
      A: [7]
    no_spawn:
      A: Fail

  # A null integer is the same as an absent one: the exec still counts.
  - name: integer_null
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:01Z","pid":null,"cgroup_id":null,"trace_id":"c0de00000000000000000000000000a1"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "ok"
    spawned:
      A: [0]
    no_spawn:
      A: Fail
      C: Pass

  # A file event is returned for every trace: inotify cannot tell them apart.
  - name: file_events_for_every_trace
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:01Z","file_op":"create","path":"/r/a","root":"/r","is_dir":false,"source":"inotify","attribution":"root"}'
      - '{"time":"2026-10-28T12:00:01Z","file_op":"write","path":"/r/a","root":"/r","is_dir":false,"source":"inotify","attribution":"root"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "ok"
    wrote:
      A: ["/r/a", "/r/a"]
      B: ["/r/a", "/r/a"]
    no_write:
      A: Fail
      C: Fail

  # Nothing seen, on a healthy capture of a watched root.
  - name: file_nothing_seen
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "ok"
    wrote:
      A: []
    no_write:
      A: Pass
    no_write_paths: ["/r/secret"]

  # A change elsewhere under the root is not about this path.
  - name: file_seen_elsewhere
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:01Z","file_op":"write","path":"/r/log","root":"/r","is_dir":false,"source":"inotify","attribution":"root"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "ok"
    no_write:
      A: Pass
    no_write_paths: ["/r/secret"]

  # A path is matched with everything below it, on a directory boundary.
  - name: file_below_the_path
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:01Z","file_op":"write","path":"/r/secret/deep","root":"/r","is_dir":false,"source":"inotify","attribution":"root"}'
      - '{"time":"2026-10-28T12:00:01Z","file_op":"write","path":"/r/secrets","root":"/r","is_dir":false,"source":"inotify","attribution":"root"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "ok"
    no_write:
      A: Fail
    no_write_paths: ["/r/secret"]

  # A rename of a directory above the path moved it with no event naming it.
  - name: file_rename_above_the_path
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:01Z","file_op":"rename","path":"/r/dir","root":"/r","is_dir":true,"source":"inotify","attribution":"root","rename":"from","cookie":7}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "ok"
    no_write:
      A: Fail
    no_write_paths: ["/r/dir/secret"]

  # A path outside the roots could never be seen: no absence rests on it.
  - name: file_path_not_watched
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "ok"
    no_write:
      A: Inconclusive
    no_write_paths: ["/elsewhere/secret"]

  # A start record naming no roots covers no path.
  - name: file_no_roots
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "ok"
    no_write:
      A: Inconclusive
    no_write_paths: ["/r/secret"]

  # A witness with no roots watched nothing: a claim about "anything" has
  # nothing under it either. An exec witness's file looks like this.
  - name: file_no_roots_no_paths
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "ok"
    no_write:
      A: Inconclusive

  # A line is still a line with no roots to put it under.
  - name: file_no_roots_with_a_line
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:01Z","file_op":"write","path":"/r/a","root":"/r","is_dir":false,"source":"inotify","attribution":"root"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "ok"
    no_write:
      A: Fail

  # A path through a symlink is spelled another way, or lands outside the root.
  - name: file_path_crosses_a_symlink
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true,"symlinks":["/r/current"]}'
    health: "ok"
    no_write:
      A: Inconclusive
    no_write_paths: ["/r/current/conf"]

  # A symlink elsewhere, or inside a claimed directory, is not crossed.
  - name: file_path_beside_a_symlink
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true,"symlinks":["/r/dir/link"]}'
    health: "ok"
    no_write:
      A: Pass
    no_write_paths: ["/r/dir"]

  # Closed with no write seen: all a change by mmap or native AIO may leave.
  - name: file_silent_close
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true,"silent_closes":["/r/dir/a"]}'
    health: "ok"
    no_write:
      A: Inconclusive
    no_write_paths: ["/r/dir"]

  # With no paths the claim is about everything, so any silent close counts.
  - name: file_silent_close_no_paths
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true,"silent_closes":["/r/a"]}'
    health: "ok"
    no_write:
      A: Inconclusive

  - name: file_silent_close_elsewhere
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true,"silent_closes":["/r/a"]}'
    health: "ok"
    no_write:
      A: Pass
    no_write_paths: ["/r/b"]

  # What the check at stop found counts as any other line.
  - name: file_found_by_the_stop_check
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:08Z","file_op":"write","path":"/r/a","root":"/r","is_dir":false,"source":"stat","attribution":"root"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "ok"
    no_write:
      A: Fail
    no_write_paths: ["/r/a"]

  # The queue overflowed: what was seen stands, silence proves nothing.
  - name: file_overflow
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:01Z","file_op":"write","path":"/r/a","root":"/r","is_dir":false,"source":"inotify","attribution":"root"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":false,"error":"file witness: 1 gap(s), first: overflow: events lost","coverage":"overflows=1"}'
    health: "overflow"
    wrote:
      A: ["/r/a"]
    no_write:
      A: Fail

  # The same, about a path nothing touched.
  - name: file_overflow_other_path
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":false,"error":"file witness: 1 gap(s), first: overflow: events lost"}'
    health: "overflow"
    no_write:
      A: Inconclusive
    no_write_paths: ["/r/secret"]

  # A file event outside the window is a fault, and still counts.
  - name: file_outside_window
    lines:
      - '{"time":"2026-10-28T12:00:01Z","file_op":"write","path":"/r/a","root":"/r","is_dir":false,"source":"inotify","attribution":"root"}'
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "outside any capture window"
    wrote:
      A: ["/r/a"]
    no_write:
      A: Fail

  # Exec lines and file lines can share a file, and do not mix.
  - name: file_and_exec_together
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:01Z","pid":7,"trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:01Z","file_op":"write","path":"/r/a","root":"/r","is_dir":false,"source":"inotify","attribution":"root"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "ok"
    spawned:
      A: [7]
      B: []
    wrote:
      A: ["/r/a"]

  # A line with a trace ID belongs to that trace alone.
  - name: file_event_with_a_trace
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:01Z","file_op":"write","path":"/r/a","root":"/r","is_dir":false,"source":"inotify","attribution":"cgroup","trace_id":"c0de00000000000000000000000000a1"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "ok"
    wrote:
      A: ["/r/a"]
      B: []

  # An unknown kind might have been a write: never skipped.
  - name: file_unknown_op
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:01Z","file_op":"mangle","path":"/r/a","root":"/r","is_dir":false,"source":"inotify","attribution":"root"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "unknown file_op"

  # A file event must say where.
  - name: file_no_path
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:01Z","file_op":"write"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "no path"

  # A file event must say when.
  - name: file_no_time
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["file"]}'
      - '{"file_op":"write","path":"/r/a"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "no time"

  # A path of the wrong type is a read error.
  - name: file_path_not_a_string
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:01Z","file_op":"write","path":7}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "line 2"

  # is_dir of the wrong type is a read error.
  - name: file_is_dir_not_a_bool
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:01Z","file_op":"write","path":"/r/a","is_dir":"yes"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "line 2"

  # A key that differs only by case is refused, as for an exec.
  - name: file_key_in_another_case
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:01Z","file_op":"write","path":"/r/a","Is_Dir":true}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "another case"

  # Roots must be a list of strings.
  - name: file_roots_not_a_list
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":"/r","captures":["file"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "line 1"

  # A broker wrote to one subscriber and acked the publisher: the other subscriber's absence rests on the file.
  - name: delivery_to_one_peer
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"deliver","pid":7,"host_pid":4007,"comm":"broker","protocol":"tcp","peer":"127.0.0.1:40001","local":"127.0.0.1:1883","bytes":21,"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"deliver","pid":7,"host_pid":4007,"comm":"broker","protocol":"tcp","peer":"127.0.0.1:40003","local":"127.0.0.1:1883","bytes":21,"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "ok"
    spawned:
      A: []
    delivered:
      A: ["127.0.0.1:40001", "127.0.0.1:40003"]
      B: []
    no_delivery:
      A: Pass
      B: Pass
    no_delivery_peers: ["127.0.0.1:40002"]

  # The same file, asked about the peer that was written to.
  - name: delivery_to_the_refused_peer
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"deliver","pid":7,"host_pid":4007,"comm":"broker","protocol":"tcp","peer":"127.0.0.1:40001","local":"127.0.0.1:1883","bytes":21,"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "ok"
    no_delivery:
      A: Fail
      C: Pass
    no_delivery_peers: ["127.0.0.1:40001"]

  # No peers named: every send counts, acks included.
  - name: delivery_any_peer
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"deliver","pid":7,"host_pid":4007,"comm":"broker","protocol":"tcp","peer":"127.0.0.1:40001","local":"127.0.0.1:1883","bytes":21,"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "ok"
    no_delivery:
      A: Fail
      C: Pass

  # A send that named its destination is delivery to it. An IPv6 peer, and a mapped one read as its IPv4 form.
  - name: delivery_named_and_ipv6
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"sendmsg","pid":7,"host_pid":4007,"comm":"broker","protocol":"tcp","peer":"[2001:db8::1]:53","local":"127.0.0.1:1883","bytes":21,"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"deliver","pid":7,"host_pid":4007,"comm":"broker","protocol":"tcp","peer":"[::ffff:127.0.0.1]:40001","local":"127.0.0.1:1883","bytes":21,"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "ok"
    delivered:
      A: ["[2001:db8::1]:53", "127.0.0.1:40001"]
    no_delivery:
      A: Fail
    no_delivery_peers: ["127.0.0.1:40001"]

  # The witness saw a send but not its peer: it may have gone to the refused one.
  - name: delivery_unknown_peer
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"deliver","pid":7,"host_pid":4007,"comm":"broker","protocol":"tcp","peer":"","local":"127.0.0.1:1883","bytes":21,"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: "ok"
    delivered:
      A: [""]
    no_delivery:
      A: Fail
    no_delivery_peers: ["127.0.0.1:40002"]

  # A lossy capture: what it saw still counts, and no absence rests on it.
  - name: delivery_unhealthy_stop
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"deliver","pid":7,"host_pid":4007,"comm":"broker","protocol":"tcp","peer":"127.0.0.1:40001","local":"127.0.0.1:1883","bytes":21,"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":false,"error":"lost 3 kernel event(s)"}'
    health: "lost 3 kernel event(s)"
    no_delivery:
      A: Fail
      B: Inconclusive
    no_delivery_peers: ["127.0.0.1:40001"]

  # A delivery with no window around it proves the window was not there.
  - name: delivery_outside_window
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
      - '{"time":"2026-10-28T12:00:10Z","delivery_op":"deliver","pid":7,"host_pid":4007,"comm":"broker","protocol":"tcp","peer":"127.0.0.1:40001","local":"127.0.0.1:1883","bytes":21,"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
    health: "a delivery outside any capture window"
    no_delivery:
      A: Fail
      B: Inconclusive
    no_delivery_peers: ["127.0.0.1:40001"]

  # An op no reader knows is a read error, never a skip.
  - name: delivery_unknown_op
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"multicast","pid":7,"host_pid":4007,"comm":"broker","protocol":"tcp","peer":"127.0.0.1:40001","local":"127.0.0.1:1883","bytes":21,"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "line 2"

  # A peer that does not parse is a read error: only an empty one means unknown.
  - name: delivery_bad_peer
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"deliver","pid":7,"host_pid":4007,"comm":"broker","protocol":"tcp","peer":"localhost:1883","local":"127.0.0.1:1883","bytes":21,"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "line 2"

  # So is a bad local address.
  - name: delivery_bad_local
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"deliver","pid":7,"host_pid":4007,"comm":"broker","protocol":"tcp","peer":"127.0.0.1:40001","local":"nowhere","bytes":21,"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "line 2"

  # A delivery line must carry its time.
  - name: delivery_no_time
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"delivery_op":"deliver","pid":7,"peer":"127.0.0.1:40001"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "line 2"

  # A byte count that is not one.
  - name: delivery_bytes_negative
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"deliver","peer":"127.0.0.1:40001","bytes":-1}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "line 2"

  # A key in another case: Go would read it, another reader would not.
  - name: delivery_key_case
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"deliver","Peer":"127.0.0.1:40001"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "line 2"

  # A file from a witness that never ran the delivery hook has no delivery lines
  # because nothing looked, however healthy it is.
  - name: delivery_no_capture_named
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: ok
    no_delivery:
      A: Inconclusive

  # Naming other captures does not name this one.
  - name: delivery_capture_not_listed
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: ok
    no_delivery:
      A: Inconclusive

  # A capture counts from the start record alone: a stop record cannot claim one.
  - name: delivery_capture_on_the_stop_record
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true,"captures":["delivery"]}'
    health: ok
    no_delivery:
      A: Inconclusive

  # With the capture named, the same empty file is a Pass.
  - name: delivery_capture_named_and_empty
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: ok
    no_delivery:
      A: Pass

  # A sighting stands whatever the start record says.
  - name: delivery_seen_with_no_capture_named
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"deliver","pid":7,"host_pid":4007,"comm":"broker","protocol":"tcp","peer":"127.0.0.1:40001","local":"127.0.0.1:1883","bytes":21,"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: ok
    no_delivery:
      A: Fail

  - name: delivery_captures_not_a_list
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":"delivery"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "line 1"

  - name: delivery_peer_bracketed_ipv4
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"deliver","pid":7,"host_pid":4007,"comm":"broker","protocol":"tcp","peer":"[1.2.3.4]:5","local":"127.0.0.1:1883","bytes":21,"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "line 2"

  - name: delivery_local_bracketed_ipv4
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"deliver","pid":7,"host_pid":4007,"comm":"broker","protocol":"tcp","peer":"127.0.0.1:40001","local":"[1.2.3.4]:5","bytes":21,"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "line 2"

  - name: delivery_peer_final_newline
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"deliver","pid":7,"host_pid":4007,"comm":"broker","protocol":"tcp","peer":"1.2.3.4:5\n","local":"127.0.0.1:1883","bytes":21,"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "line 2"

  - name: delivery_local_final_newline
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"deliver","pid":7,"host_pid":4007,"comm":"broker","protocol":"tcp","peer":"127.0.0.1:40001","local":"1.2.3.4:5\n","bytes":21,"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "line 2"

  - name: delivery_peer_zone
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"deliver","pid":7,"host_pid":4007,"comm":"broker","protocol":"tcp","peer":"[fe80::1%eth0]:5","local":"127.0.0.1:1883","bytes":21,"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "line 2"

  - name: delivery_local_zone
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"deliver","pid":7,"host_pid":4007,"comm":"broker","protocol":"tcp","peer":"127.0.0.1:40001","local":"[fe80::1%eth0]:5","bytes":21,"cgroup_id":91,"cgroup":"subpoena/c0de00000000000000000000000000a1","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "line 2"

  # Row lines: only what committed is committed, and it holds for every trace.
  - name: rows_committed_for_every_trace
    lines:
      - '{"time":"2026-11-06T12:00:00Z","record":"start","healthy":false,"captures":["row"]}'
      - '{"time":"2026-11-06T12:00:01Z","event":"row","engine":"postgres","conn":1,"dest":"127.0.0.1:5432","statement":"INSERT INTO users VALUES (1)","verb":"INSERT","tables":["users"],"opaque":false,"rows":1,"outcome":"committed","attribution":"destination"}'
      - '{"time":"2026-11-06T12:00:02Z","event":"row","engine":"postgres","conn":1,"dest":"127.0.0.1:5432","statement":"DELETE FROM users","verb":"DELETE","tables":["users"],"opaque":false,"rows":3,"outcome":"rolled_back","attribution":"destination"}'
      - '{"time":"2026-11-06T12:00:03Z","event":"row","engine":"postgres","conn":1,"dest":"127.0.0.1:5432","statement":"UPDATE users SET a = 1","verb":"UPDATE","tables":["users"],"opaque":false,"rows":-1,"outcome":"failed","attribution":"destination"}'
      - '{"time":"2026-11-06T12:00:04Z","event":"row","engine":"postgres","conn":1,"dest":"127.0.0.1:5432","statement":"SELECT 1","verb":"SELECT","tables":[],"opaque":false,"rows":-1,"outcome":"read","attribution":"destination"}'
      - '{"time":"2026-11-06T12:00:05Z","event":"row","engine":"mysql","conn":2,"dest":"127.0.0.1:3306","statement":"CALL p()","verb":"CALL","tables":[],"opaque":true,"reason":"unrecognised statement","rows":-1,"outcome":"committed","attribution":"destination"}'
      - '{"time":"2026-11-06T12:00:09Z","record":"stop","healthy":true}'
    health: "ok"
    committed:
      A: [INSERT, CALL]
      B: [INSERT, CALL]
    spawned:
      A: []

  # A write with no seen outcome is not committed, and no absence rests on the file.
  - name: row_with_unknown_outcome
    lines:
      - '{"time":"2026-11-06T12:00:00Z","record":"start","healthy":false,"captures":["row"]}'
      - '{"time":"2026-11-06T12:00:01Z","event":"row","engine":"mysql","conn":1,"dest":"127.0.0.1:3306","statement":"INSERT INTO a VALUES (1)","verb":"INSERT","tables":["a"],"opaque":false,"rows":1,"outcome":"unknown","attribution":"destination"}'
      - '{"time":"2026-11-06T12:00:09Z","record":"stop","healthy":true}'
    health: "outcome was not seen"
    committed:
      A: []

  - name: row_outside_a_window
    lines:
      - '{"time":"2026-11-06T12:00:00Z","record":"start","healthy":false,"captures":["row"]}'
      - '{"time":"2026-11-06T12:00:09Z","record":"stop","healthy":true}'
      - '{"time":"2026-11-06T12:00:10Z","event":"row","engine":"mysql","conn":1,"dest":"127.0.0.1:3306","statement":"INSERT INTO a VALUES (1)","verb":"INSERT","tables":["a"],"opaque":false,"rows":1,"outcome":"committed","attribution":"destination"}'
    health: "outside any capture window"
    committed:
      A: [INSERT]

  # The witness's own verdict on a blind connection reaches the reader.
  - name: rows_from_an_unhealthy_capture
    lines:
      - '{"time":"2026-11-06T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-11-06T12:00:09Z","record":"stop","healthy":false,"error":"connection 1: unreadable: client message type 64"}'
    health: "capture unhealthy"
    committed:
      A: []

  # A missing count would read as zero rows, which is no effect.
  - name: row_without_a_count
    lines:
      - '{"time":"2026-11-06T12:00:01Z","event":"row","engine":"mysql","conn":1,"dest":"127.0.0.1:3306","statement":"INSERT INTO a VALUES (1)","verb":"INSERT","tables":["a"],"opaque":false,"outcome":"committed","attribution":"destination"}'
    read_error: "no usable rows field"

  - name: row_with_an_impossible_count
    lines:
      - '{"time":"2026-11-06T12:00:01Z","event":"row","engine":"mysql","conn":1,"dest":"127.0.0.1:3306","statement":"INSERT INTO a VALUES (1)","verb":"INSERT","tables":["a"],"opaque":false,"rows":-2,"outcome":"committed","attribution":"destination"}'
    read_error: "no usable rows field"

  - name: row_with_an_unknown_outcome_word
    lines:
      - '{"time":"2026-11-06T12:00:01Z","event":"row","engine":"mysql","conn":1,"dest":"127.0.0.1:3306","statement":"INSERT INTO a VALUES (1)","verb":"INSERT","tables":["a"],"opaque":false,"rows":1,"outcome":"maybe","attribution":"destination"}'
    read_error: "unknown outcome"

  - name: unknown_event_kind
    lines:
      - '{"time":"2026-11-06T12:00:01Z","event":"file","rows":1,"outcome":"committed"}'
    read_error: "unknown event"

  - name: row_key_in_another_case
    lines:
      - '{"time":"2026-11-06T12:00:01Z","event":"row","Rows":1,"rows":1,"outcome":"committed"}'
    read_error: "in another case"

  # A file witness's file has no exec lines because nothing looked, however healthy.
  - name: capture_no_spawn_on_a_file_witness
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: ok
    no_spawn:
      A: Inconclusive

  # The same for a database witness's file.
  - name: capture_no_spawn_on_a_row_witness
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["row"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: ok
    no_spawn:
      A: Inconclusive

  # And for a file that names nothing.
  - name: capture_no_spawn_none_named
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: ok
    no_spawn:
      A: Inconclusive

  # A stop record cannot claim a capture.
  - name: capture_exec_on_the_stop_record
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true,"captures":["exec"]}'
    health: ok
    no_spawn:
      A: Inconclusive

  # What ran is evidence whatever the file names.
  - name: capture_a_sighting_with_none_named
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false}'
      - '{"time":"2026-10-28T12:00:01Z","pid":7,"comm":"sh","trace_id":"c0de00000000000000000000000000a1"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: ok
    no_spawn:
      A: Fail

  # Roots alone are not a file witness.
  - name: capture_no_write_roots_but_no_capture
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: ok
    no_write:
      A: Inconclusive
    no_write_paths: ["/r/x"]

  # An exec witness cannot speak to a write, whatever roots it names.
  - name: capture_no_write_on_an_exec_witness
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"roots":["/r"],"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: ok
    no_write:
      A: Inconclusive
    no_write_paths: ["/r/x"]

  # Only a start record's roots count: a stop record cannot widen a claim.
  - name: file_roots_on_the_stop_record
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["file"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true,"roots":["/r"]}'
    health: ok
    no_write:
      A: Inconclusive
    no_write_paths: ["/r/x"]

  # A database witness's file, empty: absence rests on it.
  - name: capture_no_row_named
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["row"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: ok
    no_row:
      A: Pass

  # An exec witness has no row lines because nothing looked.
  - name: capture_no_row_on_an_exec_witness
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec"]}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: ok
    no_row:
      A: Inconclusive

  # A real row is evidence whatever the file names.
  - name: capture_no_row_with_a_commit
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false}'
      - '{"time":"2026-10-28T12:00:01Z","event":"row","engine":"postgres","conn":1,"dest":"127.0.0.1:5432","statement":"INSERT INTO a VALUES (1)","verb":"INSERT","tables":["a"],"opaque":false,"rows":1,"outcome":"committed","attribution":"destination"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: ok
    no_row:
      A: Fail

  # A multicast send may have reached the subscriber on its port.
  - name: delivery_multicast_on_the_port
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"sendmsg","pid":7,"comm":"app","protocol":"udp","peer":"239.7.7.7:41913","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: ok
    no_delivery:
      A: Inconclusive
    no_delivery_peers: ["172.17.0.3:41913"]

  # On another port it cannot have.
  - name: delivery_multicast_on_another_port
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"sendmsg","pid":7,"comm":"app","protocol":"udp","peer":"239.7.7.7:41999","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: ok
    no_delivery:
      A: Pass
    no_delivery_peers: ["172.17.0.3:41913"]

  # A claim about the group itself is settled.
  - name: delivery_multicast_itself
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"sendmsg","pid":7,"comm":"app","protocol":"udp","peer":"239.7.7.7:41913","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: ok
    no_delivery:
      A: Fail
    no_delivery_peers: ["239.7.7.7:41913"]

  # The limited broadcast address.
  - name: delivery_limited_broadcast
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"sendmsg","pid":7,"comm":"app","protocol":"udp","peer":"255.255.255.255:41912","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: ok
    no_delivery:
      A: Inconclusive
    no_delivery_peers: ["172.17.0.3:41912"]

  # IPv6 has only multicast.
  - name: delivery_ipv6_multicast
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"sendmsg","pid":7,"comm":"app","protocol":"udp","peer":"[ff02::1]:41912","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: ok
    no_delivery:
      A: Inconclusive
    no_delivery_peers: ["[fd00::3]:41912"]

  # A subnet's broadcast address looks like a host: only the socket option says.
  - name: delivery_subnet_broadcast
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"sendmsg","pid":7,"comm":"app","protocol":"udp","peer":"172.17.255.255:41912","broadcast":true,"trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: ok
    no_delivery:
      A: Inconclusive
    no_delivery_peers: ["172.17.0.3:41912"]

  # The same address with no option is a host, and another one.
  - name: delivery_broadcast_flag_absent
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"sendmsg","pid":7,"comm":"app","protocol":"udp","peer":"172.17.255.255:41912","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: ok
    no_delivery:
      A: Pass
    no_delivery_peers: ["172.17.0.3:41912"]

  # A connected socket keeps its broadcast route with the option cleared.
  - name: delivery_held_broadcast_route
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"deliver","pid":7,"comm":"app","protocol":"udp","peer":"172.17.255.255:41912","broadcast_route":true,"trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: ok
    no_delivery:
      A: Inconclusive
    no_delivery_peers: ["172.17.0.3:41912"]

  # The route shows a broadcast address of any shape.
  - name: delivery_held_broadcast_route_any_address
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"deliver","pid":7,"comm":"app","protocol":"udp","peer":"10.99.0.77:41912","broadcast_route":true,"trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: ok
    no_delivery:
      A: Inconclusive
    no_delivery_peers: ["10.99.0.1:41912"]

  # A first hop arrives on port 0: a rule on its address matches on any port.
  - name: delivery_first_hop_any_port
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"sendmsg","pid":7,"comm":"app","protocol":"udp","peer":"10.77.0.2:0","trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    health: ok
    no_delivery:
      A: Fail
    no_delivery_peers: ["10.77.0.2:41900"]

  # broadcast_route has one type.
  - name: delivery_broadcast_route_not_a_boolean
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"deliver","pid":7,"comm":"app","protocol":"udp","peer":"172.17.255.255:41912","broadcast_route":1,"trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "line 2"

  # broadcast has one type.
  - name: delivery_broadcast_not_a_boolean
    lines:
      - '{"time":"2026-10-28T12:00:00Z","record":"start","healthy":false,"captures":["exec","delivery"]}'
      - '{"time":"2026-10-28T12:00:01Z","delivery_op":"sendmsg","pid":7,"comm":"app","protocol":"udp","peer":"172.17.255.255:41912","broadcast":1,"trace_id":"c0de00000000000000000000000000a1","attribution":"cgroup"}'
      - '{"time":"2026-10-28T12:00:09Z","record":"stop","healthy":true}'
    read_error: "line 2"
