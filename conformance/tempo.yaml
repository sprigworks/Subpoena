# Minimal single-binary Tempo for conformance: OTLP/HTTP in, TraceQL search out,
# local storage, nothing else. Traces become searchable quickly (1s idle period)
# so the test does not wait on Tempo's production-oriented defaults.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 1s
  flush_check_period: 1s
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 1h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
