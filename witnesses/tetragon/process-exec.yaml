# DRAFT: written without access to Tetragon or a kernel with eBPF, so it has
# never been loaded. Validate with `tetra getevents -o compact` on a real node.
#
# Tetragon emits process_exec events for every exec by default (base sensor).
# This policy adds an explicit hook on the binary-load LSM path so exec events
# can be filtered and, later, switched to enforcement (Sigkill/Override) for
# sessions that were denied. Observation only for now: no actions.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: subpoena-process-exec
spec:
  kprobes:
    - call: "security_bprm_check"
      syscall: false
      args:
        - index: 0
          type: "linux_binprm"
      selectors:
        # Only watch execs from the gateway's session cgroups. Cgroup
        # filtering is by the cgroup the process runs in; the sessions live
        # under /sys/fs/cgroup/subpoena/<trace-id>. Adjust the root to match
        # the gateway's cgroup layout.
        - matchBinaries:
            - operator: "NotIn"
              values:
                - "/usr/bin/containerd-shim-runc-v2"
